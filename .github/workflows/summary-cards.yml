name: Generate profile summary cards

on:
  schedule:
    - cron: '27 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: prsdx
          UTC_OFFSET: 5.5

      - name: Generate metrics isocalendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: prsdx
          template: classic
          filename: dist/metrics.isocalendar.svg
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

      - name: Prune extra themes and commit if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find profile-summary-card-output -mindepth 1 -maxdepth 1 -type d ! -name github_dark ! -name default -exec rm -rf {} +
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Prune extra summary-card themes [skip ci]"
          git pull --rebase
          git push